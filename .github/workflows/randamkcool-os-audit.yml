name: RANDA.MKCOOL OS Daily Audit

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: randa-os-daily-audit
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out canonical project
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run RANDA OS audit
        id: randa_audit
        continue-on-error: true
        run: python3 scripts/randa_audit.py --output DAILY_AUDIT_REPORT.md

      - name: Commit daily report if changed
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- DAILY_AUDIT_REPORT.md; then
            echo "Audit report unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add DAILY_AUDIT_REPORT.md
          git commit -m "chore(audit): refresh daily audit report [skip ci]"
          git push

      - name: Open or update RANDA OS incident on failure
        if: steps.randa_audit.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const title = 'RANDA OS: Daily audit requires attention';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = [
              'The RANDA.MKCOOL OS daily audit detected a production, privacy, secret, financial-safety, or uptime problem.',
              '',
              `Workflow run: ${runUrl}`,
              '',
              'Read DAILY_AUDIT_REPORT.md before making any production change.',
              'Automation must not change price, payout destination, entitlement logic, calculation logic, or secrets.'
            ].join('\n');

            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 100
            });
            const existing = issues.find(i => !i.pull_request && i.title === title);

            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: []
              });
            }

      - name: Close RANDA OS incident after recovery
        if: steps.randa_audit.outcome == 'success'
        uses: actions/github-script@v7
        with:
          script: |
            const title = 'RANDA OS: Daily audit requires attention';
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 100
            });
            for (const issue of issues) {
              if (!issue.pull_request && issue.title === title) {
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issue.number,
                  body: 'The daily RANDA OS audit is healthy again. Closing this incident.'
                });
                await github.rest.issues.update({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issue.number,
                  state: 'closed'
                });
              }
            }

      - name: Fail workflow when audit failed
        if: steps.randa_audit.outcome == 'failure'
        run: exit 1
