name: RANDA.MKCOOL OS Daily Audit

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: randa-os-daily-audit
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out canonical project
        uses: actions/checkout@v4

      - name: Run read-only RANDA OS audit
        id: randa_audit
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/randa_audit.py \
            --output "$RUNNER_TEMP/randa-daily-audit.md" \
            --log "$RUNNER_TEMP/randa-audit-log.md"

      - name: Open or update RANDA OS incident on failure
        if: steps.randa_audit.outcome == 'failure'
        uses: actions/github-script@v9
        with:
          script: |
            const title = 'RANDA OS: Daily audit requires attention';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = [
              'The RANDA.MKCOOL OS read-only audit detected a production, privacy, secret, financial-safety, SEO, or uptime problem.',
              '',
              `Workflow run: ${runUrl}`,
              '',
              'Review the failed step before changing pricing, payout routing, entitlement logic, calculation logic, authentication policy, production origins, or secrets.',
              'Detailed audit output is intentionally ephemeral and is not committed to the public repository.'
            ].join('\n');

            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 100
            });
            const existing = issues.find(i => !i.pull_request && i.title === title);

            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: []
              });
            }

      - name: Close RANDA OS incident after recovery
        if: steps.randa_audit.outcome == 'success'
        uses: actions/github-script@v9
        with:
          script: |
            const title = 'RANDA OS: Daily audit requires attention';
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 100
            });
            for (const issue of issues) {
              if (!issue.pull_request && issue.title === title) {
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issue.number,
                  body: 'The read-only daily RANDA OS audit is healthy again. Closing this incident.'
                });
                await github.rest.issues.update({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issue.number,
                  state: 'closed'
                });
              }
            }

      - name: Fail workflow when audit failed
        if: steps.randa_audit.outcome == 'failure'
        run: exit 1
