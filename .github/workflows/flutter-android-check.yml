name: Flutter Android Check

on:
  push:
    branches:
      - main
      - feature/flutter-android-client
      - release/android-play-readiness
    paths:
      - 'flutter_app/**'
      - '.github/workflows/flutter-android-check.yml'
  pull_request:
    paths:
      - 'flutter_app/**'
      - '.github/workflows/flutter-android-check.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-release-readiness:
    name: Flutter Android Release Readiness
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Reject tracked Android signing secrets and Firebase config
        shell: bash
        run: |
          set -euo pipefail
          tracked="$(git ls-files | grep -Ei '(^|/)(google-services\.json|GoogleService-Info\.plist|key\.properties|signing\.properties|[^/]+\.(jks|keystore|p12|pfx))$' || true)"
          if [ -n "$tracked" ]; then
            echo "Refusing build: Android signing material or Firebase client config is tracked in Git."
            echo "$tracked"
            exit 1
          fi

      - name: Require committed Android project
        working-directory: flutter_app
        shell: bash
        run: |
          set -euo pipefail
          test -f android/settings.gradle.kts
          test -f android/build.gradle.kts
          test -f android/app/build.gradle.kts
          test -f android/app/src/main/AndroidManifest.xml
          test -f android/app/src/main/kotlin/systems/randamkcool/randa_mkcool_aim_sync/MainActivity.kt
          test -f android/gradle/wrapper/gradle-wrapper.properties

      - name: Install Flutter 3.47.2
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true

      - name: Verify Android release identity and security policy
        working-directory: flutter_app
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'applicationId = "systems.randamkcool.randa_mkcool_aim_sync"' android/app/build.gradle.kts
          grep -q 'namespace = "systems.randamkcool.randa_mkcool_aim_sync"' android/app/build.gradle.kts
          grep -q 'compileSdk = 36' android/app/build.gradle.kts
          grep -q 'minSdk = 24' android/app/build.gradle.kts
          grep -q 'targetSdk = 36' android/app/build.gradle.kts
          grep -q 'android:allowBackup="false"' android/app/src/main/AndroidManifest.xml
          grep -q 'android:usesCleartextTraffic="false"' android/app/src/main/AndroidManifest.xml
          grep -q 'android.permission.INTERNET' android/app/src/main/AndroidManifest.xml
          if grep -q 'signingConfigs.getByName("debug")' android/app/build.gradle.kts; then
            echo "Refusing release policy: release build must not use debug signing."
            exit 1
          fi

      - name: Resolve dependencies
        working-directory: flutter_app
        run: flutter pub get

      - name: Analyze
        working-directory: flutter_app
        run: flutter analyze

      - name: Build debug APK from committed Android project
        working-directory: flutter_app
        run: flutter build apk --debug

      - name: Build release Android App Bundle from committed Android project
        working-directory: flutter_app
        run: flutter build appbundle --release --dart-define=RANDA_DISTRIBUTION_CHANNEL=google_play

      - name: Upload debug APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: randa-mkcool-android-debug
          path: flutter_app/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error

      - name: Upload unsigned release AAB validation artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: randa-mkcool-android-release-unsigned-not-for-publishing
          path: flutter_app/build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error
