name: Flutter Android Check

on:
  push:
    branches:
      - feature/flutter-android-client
    paths:
      - 'flutter_app/**'
      - '.github/workflows/flutter-android-check.yml'
  pull_request:
    paths:
      - 'flutter_app/**'
      - '.github/workflows/flutter-android-check.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-debug-build:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Flutter 3.47.2
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true

      - name: Generate Android wrapper
        working-directory: flutter_app
        run: flutter create --platforms=android --project-name randa_mkcool_aim_sync --org systems.randamkcool .

      - name: Harden generated Android wrapper
        working-directory: flutter_app
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          gradle = Path('android/app/build.gradle.kts')
          text = gradle.read_text()
          text = text.replace('minSdk = flutter.minSdkVersion', 'minSdk = 24')
          gradle.write_text(text)

          manifest = Path('android/app/src/main/AndroidManifest.xml')
          text = manifest.read_text()
          if 'android:allowBackup=' not in text:
              text = text.replace('<application', '<application\n        android:allowBackup="false"', 1)
          manifest.write_text(text)
          PY
          rm -f test/widget_test.dart

      - name: Resolve dependencies
        working-directory: flutter_app
        run: flutter pub get

      - name: Analyze
        working-directory: flutter_app
        run: flutter analyze

      - name: Build debug APK
        working-directory: flutter_app
        run: flutter build apk --debug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: randa-mkcool-android-debug
          path: flutter_app/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
