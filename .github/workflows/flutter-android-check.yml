name: Flutter Android Check

on:
  push:
    branches:
      - main
      - feature/flutter-android-client
      - release/android-play-readiness
    paths:
      - 'flutter_app/**'
      - '.github/workflows/flutter-android-check.yml'
  pull_request:
    paths:
      - 'flutter_app/**'
      - '.github/workflows/flutter-android-check.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-release-readiness:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Reject tracked Android signing secrets
        shell: bash
        run: |
          tracked="$(git ls-files | grep -Ei '(^|/)(key\.properties|[^/]+\.(jks|keystore|p12|pfx))$' || true)"
          if [ -n "$tracked" ]; then
            echo "Refusing build: Android signing material is tracked in Git."
            echo "$tracked"
            exit 1
          fi

      - name: Install Flutter 3.47.2
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true

      - name: Generate Android wrapper
        working-directory: flutter_app
        run: flutter create --platforms=android --project-name randa_mkcool_aim_sync --org systems.randamkcool .

      - name: Harden generated Android wrapper
        working-directory: flutter_app
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          gradle = Path('android/app/build.gradle.kts')
          text = gradle.read_text()
          text = text.replace('compileSdk = flutter.compileSdkVersion', 'compileSdk = 36')
          text = text.replace('minSdk = flutter.minSdkVersion', 'minSdk = 24')
          text = text.replace('targetSdk = flutter.targetSdkVersion', 'targetSdk = 36')
          gradle.write_text(text)

          manifest = Path('android/app/src/main/AndroidManifest.xml')
          text = manifest.read_text()
          if 'android:allowBackup=' not in text:
              text = text.replace('<application', '<application\n        android:allowBackup="false"', 1)
          manifest.write_text(text)
          PY
          rm -f test/widget_test.dart

      - name: Verify Android release identity and SDK policy
        working-directory: flutter_app
        shell: bash
        run: |
          grep -q 'applicationId = "systems.randamkcool.randa_mkcool_aim_sync"' android/app/build.gradle.kts
          grep -q 'compileSdk = 36' android/app/build.gradle.kts
          grep -q 'minSdk = 24' android/app/build.gradle.kts
          grep -q 'targetSdk = 36' android/app/build.gradle.kts
          grep -q 'android:allowBackup="false"' android/app/src/main/AndroidManifest.xml

      - name: Resolve dependencies
        working-directory: flutter_app
        run: flutter pub get

      - name: Analyze
        working-directory: flutter_app
        run: flutter analyze

      - name: Build debug APK
        working-directory: flutter_app
        run: flutter build apk --debug

      - name: Build debug Android App Bundle
        working-directory: flutter_app
        run: flutter build appbundle --debug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: randa-mkcool-android-debug
          path: flutter_app/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error

      - name: Upload debug AAB policy-check artifact
        uses: actions/upload-artifact@v4
        with:
          name: randa-mkcool-android-debug-aab-not-for-publishing
          path: flutter_app/build/app/outputs/bundle/debug/app-debug.aab
          if-no-files-found: error
