name: RANDA.MKCOOL Weekly Growth

on:
  schedule:
    - cron: '20 3 * * 0'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: randa-weekly-growth
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: Check out canonical project
        uses: actions/checkout@v7

      - name: Generate weekly zero-cost update for review
        run: python3 scripts/generate_weekly_update.py

      - name: Verify generated page contains canonical link only
        shell: bash
        run: |
          set -euo pipefail
          test -s updates/index.html
          grep -Fq 'https://pmnow6851-cyber.github.io/Randa/' updates/index.html
          ! grep -Fq 'randa-aim-sync.com' updates/index.html
          ! grep -Eqi 'sk_live_|whsec_|service_role' updates/index.html

      - name: Detect whether review is needed
        id: changes
        shell: bash
        run: |
          if git diff --quiet -- updates/index.html; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Open or update owner-review reminder
        if: steps.changes.outputs.changed == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const title = 'Weekly growth update ready for owner review';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = [
              'A new zero-cost RANDA.MKCOOL growth update was generated and validated.',
              '',
              `Workflow run: ${runUrl}`,
              '',
              'For security, automation no longer pushes generated content directly to the protected production path. Review before publishing.'
            ].join('\n');

            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 100
            });
            const existing = issues.find(i => !i.pull_request && i.title === title);
            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body
              });
            }
