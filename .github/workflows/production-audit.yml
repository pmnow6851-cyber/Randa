name: RANDA Production Audit

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '15 6 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: randa-production-audit-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out project
        uses: actions/checkout@v4

      - name: Validate canonical production state
        shell: bash
        run: |
          set -euo pipefail

          for file in index.html manifest.webmanifest service-worker.js PROJECT-STATUS.md .nojekyll; do
            test -e "$file" || { echo "Missing required production file: $file"; exit 1; }
          done

          # The custom domain is intentionally disabled until DNS is verified.
          test ! -e CNAME || {
            echo "Unexpected CNAME found. Custom domain must remain disabled until DNS is verified.";
            exit 1;
          }

          grep -Fq 'https://pmnow6851-cyber.github.io/Randa/' PROJECT-STATUS.md || {
            echo "PROJECT-STATUS.md does not declare the canonical GitHub Pages route";
            exit 1;
          }

          grep -Fq 'LIVE_PAID_ONLY' PROJECT-STATUS.md || {
            echo "PROJECT-STATUS.md is not marked LIVE_PAID_ONLY";
            exit 1;
          }

          grep -Fq '£9.99' index.html || {
            echo "Public app does not display the approved £9.99 one-time price";
            exit 1;
          }

          grep -Fq 'calculate-aim-sync' index.html || {
            echo "Paid calculation endpoint wiring not found";
            exit 1;
          }

      - name: Validate manifest and service worker
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          with open('manifest.webmanifest', encoding='utf-8') as f:
              data = json.load(f)
          required = ['name', 'short_name', 'start_url', 'scope', 'display', 'icons']
          missing = [k for k in required if not data.get(k)]
          if missing:
              raise SystemExit(f'Manifest missing required values: {missing}')
          if data.get('start_url') != './' or data.get('scope') != './':
              raise SystemExit('Manifest must remain scoped to the /Randa/ GitHub Pages path')
          print('Manifest JSON: OK')
          PY

          node --check service-worker.js
          grep -q "serviceWorker" index.html || {
            echo "Service worker registration not found in index.html";
            exit 1;
          }

          grep -Fq 'randa-aim-sync-v5-paid-' service-worker.js || {
            echo "v5 paid cache namespace not found";
            exit 1;
          }

      - name: Scan tracked source for high-risk secrets
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re

          patterns = [
              re.compile(r'sk_live_[A-Za-z0-9]{16,}'),
              re.compile(r'whsec_[A-Za-z0-9]{16,}'),
              re.compile(r'sb_secret_[A-Za-z0-9_-]{16,}'),
              re.compile(r'service_role\s*[:=]\s*[\"\']?[A-Za-z0-9._-]{16,}'),
              re.compile(r'-----BEGIN (?:RSA |EC |OPENSSH )?PRIVATE KEY-----'),
          ]
          binary_suffixes = {'.png', '.jpg', '.jpeg', '.webp', '.gif', '.ico', '.zip'}
          hits = []

          for path in Path('.').rglob('*'):
              if not path.is_file() or '.git' in path.parts or path.suffix.lower() in binary_suffixes:
                  continue
              try:
                  text = path.read_text(encoding='utf-8')
              except UnicodeDecodeError:
                  continue
              for pattern in patterns:
                  if pattern.search(text):
                      hits.append(str(path))
                      break

          if hits:
              print('High-risk secret pattern detected in tracked source:')
              for hit in sorted(set(hits)):
                  print(f' - {hit}')
              raise SystemExit(1)

          print('Secret pattern scan: OK')
          PY

      - name: Check canonical production endpoint
        shell: bash
        run: |
          set -euo pipefail
          canonical='https://pmnow6851-cyber.github.io/Randa/'

          curl --fail --silent --show-error --location \
            --max-time 25 \
            --retry 2 \
            --retry-delay 3 \
            --retry-all-errors \
            "$canonical" > /tmp/randa-home.html

          test -s /tmp/randa-home.html || {
            echo "Canonical endpoint returned an empty response";
            exit 1;
          }

          grep -Fq 'v5 PAID' /tmp/randa-home.html || {
            echo "Canonical endpoint is not serving the v5 paid app";
            exit 1;
          }

          grep -Fq '£9.99' /tmp/randa-home.html || {
            echo "Canonical endpoint does not show the approved £9.99 price";
            exit 1;
          }

          grep -Fq 'PAID ACCESS REQUIRED' /tmp/randa-home.html || {
            echo "Paid-only gate marker not found on canonical endpoint";
            exit 1;
          }

      - name: Open or update production incident on failure
        if: failure() && github.event_name != 'pull_request'
        uses: actions/github-script@v9
        with:
          script: |
            const title = 'AUTOMATED AUDIT: Production health check failed';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = [
              'The automated RANDA.MKCOOL production audit failed.',
              '',
              `Workflow run: ${runUrl}`,
              '',
              'Check the failed step before changing pricing, payment routing, security rules, or the canonical app.'
            ].join('\n');

            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 100
            });

            const existing = issues.find(
              issue => !issue.pull_request && issue.title === title
            );

            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body
              });
            }

      - name: Close production incident after recovery
        if: success() && github.event_name != 'pull_request'
        uses: actions/github-script@v9
        with:
          script: |
            const title = 'AUTOMATED AUDIT: Production health check failed';
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 100
            });

            for (const issue of issues) {
              if (!issue.pull_request && issue.title === title) {
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issue.number,
                  body: 'Automated production audit is healthy again. Closing this incident.'
                });
                await github.rest.issues.update({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issue.number,
                  state: 'closed'
                });
              }
            }
