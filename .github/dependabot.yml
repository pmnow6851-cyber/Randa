version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "02:30"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 5
    groups:
      codeql:
        patterns:
          - "github/codeql-action*"
      codeql-security:
        applies-to: "security-updates"
        patterns:
          - "github/codeql-action*"
    labels: []
    commit-message:
      prefix: "chore(actions)"
  
  - package-ecosystem: "pub"
    directory: "/flutter_app"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "03:00"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 5
    labels: []
    commit-message:
      prefix: "chore(pub)"
